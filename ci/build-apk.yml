name: build-apk

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 必须是 JDK 17：JDK 21 的 javac 会写一个参数名为空的 MethodParameters 属性，
      # d8/R8 读到 null 名字直接崩（Cannot invoke String.length() ... is null）。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android build-tools 与 platform
        run: |
          SDK="$ANDROID_SDK_ROOT"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;34.0.0" "platforms;android-34" >/dev/null
          echo "BUILD_TOOLS_DIR=$SDK/build-tools/34.0.0" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$SDK/platforms/android-34/android.jar" >> "$GITHUB_ENV"
          ls "$SDK/build-tools/34.0.0/aapt2" "$SDK/platforms/android-34/android.jar"

      # 想用固定签名，就把 keystore 以 base64 存进仓库 Secret：KEYSTORE_BASE64
      # 不设置则生成临时密钥（产出的 APK 与线上版本签名不同，装过旧版需先卸载）
      - name: 解出签名密钥（可选）
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/botctl.keystore"
          echo "BOTCTL_KEYSTORE=$RUNNER_TEMP/botctl.keystore" >> "$GITHUB_ENV"
          echo "BOTCTL_KS_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "BOTCTL_KEY_ALIAS=${{ secrets.KEYSTORE_ALIAS }}" >> "$GITHUB_ENV"

      - name: 构建
        working-directory: app
        run: |
          chmod +x build_apk.sh
          bash build_apk.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: BotCtl-apk
          path: app/BotCtl-*.apk
          if-no-files-found: error
