name: build-apk

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 发 Release 需要写仓库内容；GITHUB_TOKEN 由 Actions 自动提供，无需额外 PAT
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 必须是 JDK 17：JDK 21 的 javac 会写一个参数名为空的 MethodParameters 属性，
      # d8/R8 读到 null 名字直接崩（Cannot invoke String.length() ... is null）。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android build-tools 与 platform
        run: |
          SDK="$ANDROID_SDK_ROOT"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;34.0.0" "platforms;android-34" >/dev/null
          echo "BUILD_TOOLS_DIR=$SDK/build-tools/34.0.0" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$SDK/platforms/android-34/android.jar" >> "$GITHUB_ENV"
          ls "$SDK/build-tools/34.0.0/aapt2" "$SDK/platforms/android-34/android.jar"

      # 想用固定签名，就把 keystore 以 base64 存进仓库 Secret：KEYSTORE_BASE64
      # 不设置则生成临时密钥（产出的 APK 与线上版本签名不同，装过旧版需先卸载）
      # 注意：不能在 if: 里引用 secrets（GitHub 不允许该上下文，会导致 startup_failure），
      #       所以统一放 env，在脚本里判断是否为空。
      - name: 解出签名密钥（可选）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "未配置 KEYSTORE_BASE64，将生成临时签名密钥（每次构建都不同）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/botctl.keystore"
          {
            echo "BOTCTL_KEYSTORE=$RUNNER_TEMP/botctl.keystore"
            echo "BOTCTL_KS_PASS=$KEYSTORE_PASSWORD"
            echo "BOTCTL_KEY_ALIAS=${KEYSTORE_ALIAS:-botctl}"
          } >> "$GITHUB_ENV"
          echo "已解出 keystore"

      - name: 构建
        working-directory: app
        run: |
          chmod +x build_apk.sh
          bash build_apk.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: BotCtl-apk
          path: app/BotCtl-*.apk
          if-no-files-found: error

      # ---- 标签触发时，自动发 Release（用内置 GITHUB_TOKEN，不需要 PAT）
      # 附件优先用仓库里 releases/BotCtl-<版本>.apk（维护者本机签名，签名稳定，
      # 老用户能直接覆盖升级）；只有仓库没放时才退回本次 CI 构建的产物
      # （CI 产物用临时密钥签名，装过旧版的设备必须先卸载）。
      - name: 选定发布附件
        id: pick
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          ASSET="releases/BotCtl-$VER.apk"
          if [ -f "$ASSET" ]; then
            SIGNED="维护者签名（可覆盖升级）"
          else
            ASSET="$(ls app/BotCtl-*.apk 2>/dev/null | head -1)"
            SIGNED="CI 临时签名（装过旧版需先卸载）"
          fi
          echo "附件: $ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          sha256sum "$ASSET"

      # 从 CHANGELOG.md 摘出本版本的段落，拼成 Release 说明。
      # 约定：CHANGELOG 里必须有 `## v<版本>` 这一节，否则 Release 里会提示缺失。
      - name: 生成本版更新说明
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          python3 - "$VER" > /tmp/release_body.md <<'PY'
          import re, sys
          ver = sys.argv[1]
          try:
              txt = open('CHANGELOG.md', encoding='utf-8').read()
          except FileNotFoundError:
              txt = ''
          m = re.search(r'(?ms)^##\s*v?' + re.escape(ver) + r'\b.*?(?=^##\s|\Z)', txt)
          print("**BotCtl %s**" % ver)
          print()
          print("手机端管理 ZenithProxy 机器人：Android App + 服务器部署脚本 + 地图/喊话服务。")
          print()
          print("## 本次改动")
          print()
          print(m.group(0).strip() if m else "（CHANGELOG.md 里没有 %s 的条目）" % ver)
          print()
          print("---")
          print()
          print("- 附件 `BotCtl-*.apk`：直接安装（Android 5.0+）")
          print("- 部署：[docs/部署教程.md](https://github.com/link-cle/zenith-botctl/blob/main/docs/部署教程.md)")
          print("- App 用法：[docs/App说明.md](https://github.com/link-cle/zenith-botctl/blob/main/docs/App说明.md)")
          print("- 全部版本：[CHANGELOG.md](https://github.com/link-cle/zenith-botctl/blob/main/CHANGELOG.md)")
          print("- 本项目代码 MIT；运行时依赖 ZenithProxy / ZenithProxy-WebUI（AGPL-3.0），不随仓库分发")
          PY
          echo "--- 生成结果 ---"
          cat /tmp/release_body.md

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pick.outputs.asset }}
          name: BotCtl ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: /tmp/release_body.md
